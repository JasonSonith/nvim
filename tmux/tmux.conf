# ~/.tmux.conf — Jason's tmux config

# ---------- Core ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# ---------- Prefix: Ctrl-a (easier than Ctrl-b) ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------- Reload config ----------
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Splits: open in current path ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ---------- Pane navigation: smart vim-aware (Ctrl-h/j/k/l + Alt-h/j/k/l fallback) ----------
# Works with alexghergh/nvim-tmux-navigation in nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# Alt-h/j/k/l fallback (terminals always pass these cleanly, unlike Ctrl-h/Backspace clash)
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# ---------- Pane resizing (prefix + arrow) ----------
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# ---------- Window navigation ----------
# (window prev/next available built-in: prefix n / prefix p)
bind -n 'M-,' previous-window
bind -n 'M-.' next-window

# ---------- Claude / editor workflow ----------
# prefix + e -> open nvim in left, claude in right (side-by-side)
bind e split-window -h -c "#{pane_current_path}" "claude" \; select-pane -L \; send-keys "nvim ." Enter

# prefix + c -> spawn a Claude pane on the right of current
bind c split-window -h -c "#{pane_current_path}" "claude"

# prefix + z -> zoom current pane (built-in: bring to "front" full screen)
# (default binding, included for clarity)
bind z resize-pane -Z

# prefix + Tab -> toggle to last pane (quick swap between editor and claude)
bind Tab last-pane

# prefix + s -> swap panes (move claude/editor positions)
bind s swap-pane -D

# prefix + b -> background current pane to a new window (send to back)
bind b break-pane -d

# prefix + j -> join the most recent window's pane back into current as a split
bind j choose-window "join-pane -h -s '%%'"

# ---------- Copy mode (vi-style) ----------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ---------- Status bar ----------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#cdd6f4]| "
set -g status-right "#[fg=#a6e3a1]%a %Y-%m-%d #[fg=#cdd6f4]| #[fg=#f9e2af]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W "

# ---------- Pane borders ----------
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
